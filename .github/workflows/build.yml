name: Build & Release APK

on:
  push:
    tags:
      - 'v*'        # trigger saat push tag v1.0, v1.1, dll
  workflow_dispatch:  # bisa trigger manual dari GitHub UI

permissions:
  contents: write    # untuk membuat Release & upload asset

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "cbt-smkdt-${VERSION}.apk"
          echo "APK_NAME=cbt-smkdt-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          body: |
            ## CBT Kiosk Android ${{ github.ref_name }}

            ### Download
            Unduh APK di bawah, lalu install ke perangkat Android (min SDK 26 / Android 8.0+).

            ### Install
            ```
            adb install ${{ env.APK_NAME }}
            ```

            Atau transfer file APK ke HP dan buka dari file manager.
